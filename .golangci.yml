version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - copyloopvar
    - errname
    - errorlint
    - gochecknoinits
    - goconst
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - unparam
    - whitespace
  disable:
    - errcheck  # Too noisy for CLI output

  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - assignOp
        - hugeParam
        - rangeValCopy

  exclusions:
    paths:
      - vendor

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dedene/irail-cli

output:
  max-issues-per-linter: 0
  max-same-issues: 0
