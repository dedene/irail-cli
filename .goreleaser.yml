version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/irail
    binary: irail
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dedene/irail-cli/internal/cmd.version={{.Version}}
      - -X github.com/dedene/irail-cli/internal/cmd.commit={{.Commit}}
      - -X github.com/dedene/irail-cli/internal/cmd.date={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: irail
    repository:
      owner: dedene
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dedene/irail-cli
    description: CLI for Belgian railway (NMBS/SNCB) schedules
    license: MIT
    install: |
      bin.install "irail"
    test: |
      system "#{bin}/irail", "version"
